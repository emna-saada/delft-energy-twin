# LiDAR Energy Digital Twin of Delft - pipeline configuration
crs: "EPSG:28992"          # RD New (AHN, BAG, CBS all native in this CRS)
site:
  lat: 52.0116
  lon: 4.3571
  tz: "Europe/Amsterdam"

# Study areas, defined from official CBS 2024 boundaries (PDOK wijkenbuurten)
aois:
  binnenstad:
    label: "Binnenstad (protected cityscape)"
    cbs_wijk: ["WK050311"]
  campus:
    label: "TU Delft campus"
    cbs_buurt: ["BU05032801", "BU05032805"]   # TU-Noord, TU-Campus
  voorhof:
    label: "Voorhof (post-war residential)"
    cbs_wijk: ["WK050324"]
shadow_buffer_m: 100

# Development block: one 1x1 km AHN6 tile in the historic centre (contains Markt / Nieuwe Kerk)
test_tile: "84000_447000"

ahn:
  # Tile indexes published by AHN (ahn.nl dataroom) via Ellipsis Drive WFS
  wfs:
    AHN6: ["0820faae-5240-499b-8486-cf406433cf71", "layerId_ea8b0597-57fe-4978-8ad7-a53cddb3940a"]
    AHN5: ["65945b69-81df-4270-97f0-f029033154c1", "layerId_01170035-93d3-4a38-b04c-8e7be7a7ca78"]
    AHN4: ["3aafe74b-4ece-4006-b1b7-e2947a8221a9", "layerId_d4897f93-1f04-4c0b-ae26-cc02adb5ae76"]
  main_epoch: AHN6

preprocess:
  raster_res: 0.5
  keep_classes: [1, 2, 6, 9]     # unclassified (incl. vegetation), ground, building, water
  veg_min_height: 2.0            # m above DTM for class-1 points to count as tree canopy
  outlier_k: 8
  outlier_std: 3.0

segmentation:
  footprint_inner_buffer: 0.5    # m
  dist_threshold: 0.15           # m, point-to-plane
  normal_angle_deg: 10.0
  min_points: 15
  knn: 12
  flat_slope_deg: 5.0
  max_roof_slope_deg: 70.0       # steeper planes = walls (validated: 75-90 deg planes sit on flat reference roofs)
  obstacle_height: 0.3           # m above fitted plane

solar:
  max_dist: 200.0                # m, horizon scan length
  observer_offset: 0.10          # m above plane, avoids self-shadowing from DSM noise
  albedo: 0.2
  tree_tau_leaf_on: 0.3          # transmissivity of tree crowns, May-Oct (assumption)
  tree_tau_leaf_off: 0.7         # Nov-Apr (assumption)

pv:
  module_wp: 430                 # mainstream module, 1.95 m2
  module_area_m2: 1.95
  performance_ratio: 0.80        # temperature, inverter, wiring, soiling
  edge_setback_cells: 1          # 0.5 m from plane edges and obstacles
  min_usable_area_m2: 10
  min_irradiation_kwh_m2: 650    # "suitable" threshold on the module plane
  packing_pitched: 0.85          # module area / usable area, flush-mounted
  flat_tilt_deg: 12              # east-west racks on flat roofs
  flat_gcr: 0.70                 # module area (horizontal projection) / usable flat area
  battery_kwh_per_dwelling: 5.0
  battery_kw_per_dwelling: 2.5
  battery_roundtrip: 0.90
  export_share_of_bare_tariff_2027: 0.5   # legal minimum until 2030
  price_months: 12               # CBS 85592NED average over the latest N months

[project]
name = "delft-twin"
version = "0.1.0"
description = "LiDAR energy digital twin of Delft: LoD2 roofs from AHN6, shadow-aware rooftop PV, post-2027 self-consumption"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "laspy[lazrs]==2.6.1",
    "rasterio==1.4.3",
    "geopandas==1.1.1",
    "shapely==2.1.1",
    "pyproj==3.7.1",
    "pvlib==0.13.0",
    "numba==0.61.2",
    "requests==2.32.4",
    "pyyaml==6.0.2",
    "matplotlib==3.10.3",
    "pandas==2.3.1",
    "pyogrio==0.11.0",
    "pyarrow==20.0.0",
]

[dependency-groups]
dev = ["pytest==8.4.1", "pypdf==5.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delft_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: ClimaRisk CI
on:
  push:
    paths: ["climarisk-tunisia/**", ".github/workflows/climarisk-ci.yml"]
  pull_request:
    paths: ["climarisk-tunisia/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: climarisk-tunisia
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run ruff check src tests app
      - run: uv run pytest -q
